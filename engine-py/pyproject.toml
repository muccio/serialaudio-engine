[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "serialaudio-engine"
version = "0.1.0"
description = "Algorithmic audio workstation for stem separation, MIR transient slicing, and dodecaphonic DSP transformations"
authors = [{ name = "SerialAudio Team" }]
dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "demucs>=4.0.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "scipy>=1.11.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "numpy>=1.24.0,<2.0.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]
requires-python = ">=3.11"
